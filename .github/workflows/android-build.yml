# DUSHOOD — build Android réel (phases 46, 73). Produit et vérifie les APK debug + release.
name: Android Build

on:
  push:
    branches: ["arena/**", "main"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run game logic tests (Node)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs

      - name: Build debug & release APKs + AAB
        working-directory: android
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify APKs (structure, manifest, taille non nulle)
        run: |
          set -e
          DEBUG_APK=android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=android/app/build/outputs/apk/release/app-release.apk
          for APK in "$DEBUG_APK" "$RELEASE_APK"; do
            echo "== $APK =="
            test -s "$APK" || { echo "APK vide ou absent"; exit 1; }
            ls -la "$APK"
            unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex|assets/index.html|assets/js/main.js|assets/assets/img/bg_title.jpg" || { echo "Contenu APK incomplet"; exit 1; }
          done
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$RELEASE_APK" | head -5
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$RELEASE_APK" || true
          echo "APK release size: $(du -h "$RELEASE_APK" | cut -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dushood-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dushood-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dushood-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
